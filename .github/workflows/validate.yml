name: Validate Graph Coloring Solutions
 
on:
  push:
    paths:
      - Resources/solutions/*/*.sol
 
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
 
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'
 
    - name: Install dependencies (if any)
      run: pip install -r requirements.txt || true
 
    - name: Validate solutions
      run: |
        for solution in Resources/solutions/*/*.sol; do
          instance=$(basename "$solution" .sol).col
          echo $instance
          python src/checker.py Resources/instances/$instance $solution || exit 1
        done
 
    - name: Update best solutions
      if: success()
      run: |
        # Script to update best_solutions.md if a new upper bound is found
        python src/update_best.py

    - name: Commit and Push Changes
      if: success()
      run: |
        git config --global user.name 'github-actions'
        git config --global user..email 'github-actions@github.com'
        git add best_solutions.md
        git commit -m "Updated best known solutions" || exit 0
        git push