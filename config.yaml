algos: # list of the algorithms to be used for ISA
  - DSATUR
  - RLF
  - Greedy
  - TABUCOL

##
# All below metrics are used to perform Instance Space Analysis
# Specifically these are used to create the options.json file
# Which sets the parameters for the library PyIspace, which is run
# using a CL call.
##
perf:
  epsilon: 0.0125
  MaxPerf: false
  AbsPerf: true

general:
  betaThreshold: 0.55

parallel:
  flag: false
  ncores: 2

auto:
  preproc: true
  featsel: false

bound:
  flag: true

norm:
  flag: true

corr:
  flag: true
  threshold: 10

clust:
  flag: true
  KDEFAULT: 10
  SILTHRESHOLD: 0.9
  NTREES: 50
  MaxIter: 1000
  Replicates: 100

pilot:
  analytic: false
  ntries: 5

cloister:
  pval: 0.05
  cthres: 0.7

pythia:
  cvfolds: 5
  ispolykrnl: true
  useweights: false
  uselibsvm: false

trace:
  usesim: false
  PI: 0.55

selvars:
  smallscaleflag: false
  smallscale: 0.5
  fileidxflag: false
  fileidx: ""
  densityflag: false
  mindistance: 0.1

outputs:
  csv: true
  web: false
  png: false
